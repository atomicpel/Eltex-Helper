name: Тесты

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          # то же, что внутри пакета для Windows 7: Python 3.8 + закреплённые версии библиотек
          - {os: windows-latest, python: "3.8", win7: true}
          - {os: ubuntu-22.04, python: "3.8", win7: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Установить зависимости
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.win7 }}" = "true" ]; then
            pip install -r packaging/requirements-win7.txt
            pip install --no-deps .
          else
            pip install .
          fi
          pip install pytest
      - name: Тесты
        run: python -m pytest -q
